name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install
        run: |
          npm ci --prefix server
          npm ci --prefix web

      - name: Build static frontend
        run: npm run build --prefix web
        env:
          VITE_STATIC: '1'

      - name: Snapshot demo API
        run: |
          (cd server && PORT=5000 npm run demo > ../demo.log 2>&1 &)
          for i in $(seq 30); do curl -sf http://127.0.0.1:5000/api/health && break; sleep 1; done
          sleep 60  # дати симуляції накопичити живі знімки (пишуться раз на 10 с) для графіка потужності
          node web/scripts/snapshot.mjs web/dist
          cp web/dist/index.html web/dist/404.html

      - name: Show demo server log
        if: failure()
        run: cat demo.log

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
